name: Sync Docs to Qdrant

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/*.md'  # Ne se déclenche QUE si un fichier markdown change dans docs/

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests qdrant-client

      - name: Run Ingestion Script
        env:
          # Adresses de tes services (exposées via VPN, Ngrok ou IP publique en prod)
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          OLLAMA_URL: ${{ secrets.OLLAMA_URL }}
        run: |
          python ingest.py
